[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-brain"
version = "0.1.0"
description = "Company Brain — an ADK-based knowledge agent with hybrid RAG, citations and compliance guardrails for a DTC brand"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.11",
  "qdrant-client>=1.15",
  "fastembed>=0.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cb-ingest = "company_brain.knowledge.ingest:main"
cb-eval-retrieval = "company_brain.evaluation.retrieval:main"
cb-eval-agent = "company_brain.evaluation.agent_eval:main"
cb-serve = "company_brain.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: loads real embedding models (cached after first download)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long assertions read better unwrapped
