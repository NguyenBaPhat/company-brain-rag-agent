# Serves the built SPA and reverse-proxies API + WebSocket to the backend (same origin => no CORS).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;  # keep the port so same-origin checks pass
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;  # long agent turns; the client pings every 25s
    proxy_buffering off;
  }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
  location = /healthz { proxy_pass http://backend:8000; }

  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
